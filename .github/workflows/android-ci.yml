name: Kryptx CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Zero-Network Hard Security Check
        run: |
          echo "Auditing manifest for forbidden network permissions..."
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.INTERNET detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_NETWORK_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_WIFI_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_WIFI_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          echo "Zero-Network verification passed: 0 network permissions present."

      - name: Generate Coverage Report & Verify Threshold (85% Hard Gate)
        run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [test, sast]  # Only build if tests and SAST pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Reproducible Build Environment
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
          echo "TZ=UTC" >> $GITHUB_ENV
          echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Reproducible Debug APK
        run: ./gradlew assembleDebug -Dorg.gradle.project.reproducible=true --no-daemon --stacktrace

      - name: Generate Debug SHA-256 Checksum
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            echo "Debug APK SHA-256: $(cat $APK_PATH.sha256)"
          fi

      - name: Enforce APK Size Budget (<= 25 MB)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            MAX_BYTES=26214400 # 25 MB
            echo "Debug APK size: $SIZE_BYTES bytes (Budget: $MAX_BYTES bytes)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 25 MB budget!"
              exit 1
            fi
            echo "APK size budget check passed."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryptx-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [test, sast]  # Only build if tests and SAST pass
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KRYPTX_KEYSTORE_BASE64: ${{ secrets.KRYPTX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KRYPTX_KEYSTORE_BASE64" ]; then
            echo "$KRYPTX_KEYSTORE_BASE64" | base64 --decode > app/kryptx-release-key.jks
            echo "Release keystore decoded successfully."
          else
            echo "KRYPTX_KEYSTORE_BASE64 not configured in secrets."
          fi

      - name: Build Reproducible Release APK
        env:
          KRYPTX_KEYSTORE_PASSWORD: ${{ secrets.KRYPTX_KEYSTORE_PASSWORD }}
          KRYPTX_KEY_PASSWORD: ${{ secrets.KRYPTX_KEY_PASSWORD }}
          KRYPTX_KEY_ALIAS: ${{ secrets.KRYPTX_KEY_ALIAS }}
        run: ./gradlew assembleRelease -Dorg.gradle.project.reproducible=true --no-daemon --stacktrace

      - name: Generate Release SHA-256 Checksum
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            sha256sum "$APK_PATH" > "$APK_PATH.sha256"
            echo "Release APK SHA-256: $(cat $APK_PATH.sha256)"
          fi

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          if [ -f app/kryptx-release-key.jks ]; then
            shred -u app/kryptx-release-key.jks 2>/dev/null || rm -f app/kryptx-release-key.jks
          fi

      - name: Generate SBOM
        run: ./gradlew dependencies --configuration releaseRuntimeClasspath > sbom-dependencies.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: kryptx-sbom
          path: sbom-dependencies.txt

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryptx-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

  rust-tests:
    name: Rust Crypto Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Tests
        working-directory: app/src/main/rust/kryptx_crypto
        run: cargo test --verbose

  sast:
    name: SAST – Semgrep & MobSFScan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Semgrep: android + kotlin + owasp-top-ten rule sets
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/android
            p/kotlin
            p/owasp-top-ten
        env:
          # Run in audit mode so findings are reported but do not block CI.
          # Promote to blocking by removing SEMGREP_APP_TOKEN or setting --error flag.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # MobSFScan: purpose-built Android static analyser for Kotlin / Java source + manifest
      - name: Set up Python for MobSFScan
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MobSFScan
        run: pip install mobsfscan==0.3.9

      - name: Run MobSFScan
        run: |
          mobsfscan --json -o mobsfscan-results.json app/src/main/java app/src/main/AndroidManifest.xml || true
          # Surface any CRITICAL findings as a hard-failure gate
          if python3 - <<'EOF'
          import json, sys
          with open("mobsfscan-results.json") as f:
              data = json.load(f)
          results = data.get("results", {})
          criticals = [k for k, v in results.items() if v.get("metadata", {}).get("severity", "").upper() == "CRITICAL"]
          if criticals:
              print(f"CRITICAL MobSFScan findings ({len(criticals)}):", ", ".join(criticals))
              sys.exit(1)
          EOF
          then
            echo "MobSFScan: no CRITICAL findings."
          fi

      - name: Upload SAST Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: mobsfscan-results.json

  emulator-tests:
    name: Instrumented Android Tests
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Connected Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Android Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-test-results-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/


  dependency-review:
    name: Dependency Security Review
    runs-on: ubuntu-latest
    # Only run on PRs — this action compares base vs head to find newly introduced
    # vulnerable or license-violating dependencies before they merge.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on any HIGH or CRITICAL CVE introduced by this PR.
          fail-on-severity: high
          # Deny GPL-2.0, GPL-3.0, and AGPL-3.0 to protect app store distribution.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Allow internal and well-known permissive licenses.
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0

  dependency-verification-check:
    name: Gradle Dependency Integrity
    runs-on: ubuntu-latest
    # Validates that all dependency checksums recorded in
    # gradle/verification-metadata.xml match what Gradle resolves at build time.
    # This catches supply-chain attacks where a dependency is silently replaced
    # (e.g. typosquatting, compromised Maven repo, cache poisoning).
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Dependency Checksums
        # Gradle reads gradle/verification-metadata.xml automatically when it exists.
        # Running any Gradle task with the file present activates checksum verification:
        # if any resolved artifact's SHA-256 does not match the recorded value, Gradle
        # aborts with a dependency verification failure, blocking the build.
        #
        # This catches:
        #   - Supply-chain attacks (compromised Maven repo serving a backdoored artifact)
        #   - Cache poisoning (malicious artifact injected into the Gradle cache)
        #   - Typosquatting (a new transitive dep resolves to a different artifact)
        #   - Silent version bumps in mutable metadata (SNAPSHOT versions, etc.)
        #
        # The verification-metadata.xml is committed to the repo and updated via
        # './gradlew --write-verification-metadata sha256 help' whenever deps change.
        run: |
          if [ -f "gradle/verification-metadata.xml" ]; then
            echo "verification-metadata.xml found — Gradle will enforce SHA-256 checksums on all resolved artifacts"
            # Running 'dependencies' forces resolution of the full dependency graph,
            # triggering checksum verification on every artifact.
            ./gradlew dependencies --configuration releaseRuntimeClasspath --no-daemon 2>&1 | tail -20
            echo "Dependency integrity verification PASSED — all artifact checksums matched."
          else
            echo "ERROR: gradle/verification-metadata.xml not found."
            echo "Supply-chain protection is disabled. This must not happen in a production repo."
            echo "Regenerate with: ./gradlew --write-verification-metadata sha256 help"
            exit 1
          fi
