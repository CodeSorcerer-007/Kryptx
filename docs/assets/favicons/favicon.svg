<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer Shield -->
  <path d="M256 32 L448 96 V256 C448 376 256 480 256 480 C256 480 64 376 64 256 V96 Z" fill="#080A10" stroke="url(#shieldGrad)" stroke-width="24" filter="url(#glow)"/>
  <!-- Keyhole & Lock Core -->
  <path d="M256 96 L384 144 V240 C384 328 256 400 256 400 C256 400 128 328 128 240 V144 Z" fill="#111420" stroke="url(#shieldGrad)" stroke-width="12"/>
  <!-- Keyhole Circuit -->
  <circle cx="256" cy="220" r="32" fill="url(#coreGrad)"/>
  <path d="M244 236 L236 304 H276 L268 236 Z" fill="url(#coreGrad)"/>
</svg>
