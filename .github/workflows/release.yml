name: Kryptx Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Release Unit Tests & Security Audits
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Zero-Network Hard Security Check
        run: |
          echo "Auditing manifest for forbidden network permissions..."
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.INTERNET detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_NETWORK_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_WIFI_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_WIFI_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          echo "Zero-Network verification passed: 0 network permissions present."

      - name: Prepare Release Keystore & Signing Environment
        env:
          KRYPTX_KEYSTORE_BASE64: ${{ secrets.KRYPTX_KEYSTORE_BASE64 }}
          KRYPTX_KEYSTORE_PASSWORD: ${{ secrets.KRYPTX_KEYSTORE_PASSWORD }}
          KRYPTX_KEY_PASSWORD: ${{ secrets.KRYPTX_KEY_PASSWORD }}
          KRYPTX_KEY_ALIAS: ${{ secrets.KRYPTX_KEY_ALIAS }}
          KRYPTX_RELEASE_FINGERPRINT: ${{ secrets.KRYPTX_RELEASE_FINGERPRINT }}
        run: |
          if [ -z "$KRYPTX_KEYSTORE_BASE64" ]; then
            echo "::error::CRITICAL: KRYPTX_KEYSTORE_BASE64 secret is not configured! Cannot produce authentic production release."
            exit 1
          fi
          echo "$KRYPTX_KEYSTORE_BASE64" | base64 --decode > app/kryptx-release-key.jks
          echo "Release keystore decoded from repository secrets."
          echo "KRYPTX_KEYSTORE_FILE=$PWD/app/kryptx-release-key.jks" >> $GITHUB_ENV
          [ -n "$KRYPTX_KEYSTORE_PASSWORD" ] && echo "KRYPTX_KEYSTORE_PASSWORD=$KRYPTX_KEYSTORE_PASSWORD" >> $GITHUB_ENV
          [ -n "$KRYPTX_KEY_PASSWORD" ] && echo "KRYPTX_KEY_PASSWORD=$KRYPTX_KEY_PASSWORD" >> $GITHUB_ENV
          [ -n "$KRYPTX_KEY_ALIAS" ] && echo "KRYPTX_KEY_ALIAS=$KRYPTX_KEY_ALIAS" >> $GITHUB_ENV
          [ -n "$KRYPTX_RELEASE_FINGERPRINT" ] && echo "KRYPTX_RELEASE_FINGERPRINT=$KRYPTX_RELEASE_FINGERPRINT" >> $GITHUB_ENV

      - name: Build Release APK & AAB Bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:copyReleaseApk :app:copyReleaseBundle --no-daemon --stacktrace

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          if [ -f app/kryptx-release-key.jks ]; then
            shred -u app/kryptx-release-key.jks 2>/dev/null || rm -f app/kryptx-release-key.jks
          fi

      - name: Enforce Release Size Budgets (<= 25 MB Release APK / <= 35 MB AAB)
        run: |
          APK_FILES=$(find app/build/outputs/apk/release/ -name "*.apk")
          if [ -z "$APK_FILES" ]; then
            echo "No release APK found to check size!"
            exit 1
          fi
          MAX_BYTES_APK=26214400 # 25 MB
          for APK_PATH in $APK_FILES; do
            SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            echo "Release APK: $APK_PATH ($SIZE_BYTES bytes, budget: $MAX_BYTES_APK bytes)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES_APK" ]; then
              echo "ERROR: Release APK $APK_PATH exceeds 25 MB budget ($SIZE_BYTES > $MAX_BYTES_APK)!"
              exit 1
            fi
          done
          AAB_FILES=$(find app/build/outputs/bundle/release/ -name "*.aab")
          MAX_BYTES_AAB=36700160 # 35 MB
          for AAB_PATH in $AAB_FILES; do
            SIZE_BYTES=$(stat -c%s "$AAB_PATH" 2>/dev/null || stat -f%z "$AAB_PATH")
            echo "Release AAB: $AAB_PATH ($SIZE_BYTES bytes, budget: $MAX_BYTES_AAB bytes)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES_AAB" ]; then
              echo "ERROR: Release AAB $AAB_PATH exceeds 35 MB budget ($SIZE_BYTES > $MAX_BYTES_AAB)!"
              exit 1
            fi
          done
          echo "All release binary size budgets verified."

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p release-dist
          if [ -d "apk" ] && [ "$(ls -A apk 2>/dev/null)" ]; then
            cp apk/* release-dist/ 2>/dev/null || true
          fi
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-dist/ \;
          find app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release-dist/ \;
          cd release-dist
          for f in *.apk *.aab; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
              echo "Checksum generated: $f SHA-256: $(cat ${f}.sha256)"
            fi
          done
          cd ..

      - name: Generate Software Bill of Materials (SBOM)
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > release-dist/sbom-dependencies.txt

      - name: Generate SLSA Level 2 Build Provenance Attestation
        run: |
          cd release-dist
          for pkg in *.apk *.aab; do
            if [ -f "$pkg" ]; then
              PKG_HASH=$(sha256sum "$pkg" | awk '{print $1}')
              python3 -c "
          import json
          data = {
              '_type': 'https://in-toto.io/Statement/v0.1',
              'subject': [{'name': '$pkg', 'digest': {'sha256': '$PKG_HASH'}}],
              'predicateType': 'https://slsa.dev/provenance/v0.2',
              'predicate': {
                  'builder': {'id': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'},
                  'buildType': 'https://github.com/actions/runner',
                  'invocation': {
                      'configSource': {
                          'uri': 'git+https://github.com/${{ github.repository }}@${{ github.ref }}',
                          'digest': {'sha1': '${{ github.sha }}'},
                          'entryPoint': '.github/workflows/release.yml'
                      }
                  }
              }
          }
          with open('${pkg}.intoto.jsonl', 'w') as f:
              f.write(json.dumps(data) + '\n')
          "
              echo "Generated SLSA provenance for $pkg: ${pkg}.intoto.jsonl"
            fi
          done
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
