name: Kryptx Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Release Unit Tests & Security Audits
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Zero-Network Hard Security Check
        run: |
          echo "Auditing manifest for forbidden network permissions..."
          if grep -q "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.INTERNET detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_NETWORK_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_NETWORK_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          if grep -q "android.permission.ACCESS_WIFI_STATE" app/src/main/AndroidManifest.xml; then
            echo "ERROR: android.permission.ACCESS_WIFI_STATE detected in AndroidManifest.xml!"
            exit 1
          fi
          echo "Zero-Network verification passed: 0 network permissions present."

      - name: Prepare Release Keystore & Signing Environment
        env:
          KRYPTX_KEYSTORE_BASE64: ${{ secrets.KRYPTX_KEYSTORE_BASE64 }}
          KRYPTX_KEYSTORE_PASSWORD: ${{ secrets.KRYPTX_KEYSTORE_PASSWORD }}
          KRYPTX_KEY_PASSWORD: ${{ secrets.KRYPTX_KEY_PASSWORD }}
          KRYPTX_KEY_ALIAS: ${{ secrets.KRYPTX_KEY_ALIAS }}
          KRYPTX_RELEASE_FINGERPRINT: ${{ secrets.KRYPTX_RELEASE_FINGERPRINT }}
        run: |
          if [ -n "$KRYPTX_KEYSTORE_BASE64" ]; then
            echo "$KRYPTX_KEYSTORE_BASE64" | base64 --decode > app/kryptx-release-key.jks
            echo "Release keystore decoded from repository secrets."
            echo "KRYPTX_KEYSTORE_FILE=$PWD/app/kryptx-release-key.jks" >> $GITHUB_ENV
            [ -n "$KRYPTX_KEYSTORE_PASSWORD" ] && echo "KRYPTX_KEYSTORE_PASSWORD=$KRYPTX_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            [ -n "$KRYPTX_KEY_PASSWORD" ] && echo "KRYPTX_KEY_PASSWORD=$KRYPTX_KEY_PASSWORD" >> $GITHUB_ENV
            [ -n "$KRYPTX_KEY_ALIAS" ] && echo "KRYPTX_KEY_ALIAS=$KRYPTX_KEY_ALIAS" >> $GITHUB_ENV
            [ -n "$KRYPTX_RELEASE_FINGERPRINT" ] && echo "KRYPTX_RELEASE_FINGERPRINT=$KRYPTX_RELEASE_FINGERPRINT" >> $GITHUB_ENV
          else
            echo "KRYPTX_KEYSTORE_BASE64 not configured in secrets — generating CI signing key..."
            keytool -genkeypair -v -keystore app/kryptx-release-key.jks -alias kryptx-release -keyalg RSA -keysize 2048 -validity 10000 -storepass "kryptx-ci-pass" -keypass "kryptx-ci-pass" -dname "CN=Kryptx CI, O=Kryptx, C=US"
            echo "KRYPTX_KEYSTORE_FILE=$PWD/app/kryptx-release-key.jks" >> $GITHUB_ENV
            echo "KRYPTX_KEYSTORE_PASSWORD=kryptx-ci-pass" >> $GITHUB_ENV
            echo "KRYPTX_KEY_PASSWORD=kryptx-ci-pass" >> $GITHUB_ENV
            echo "KRYPTX_KEY_ALIAS=kryptx-release" >> $GITHUB_ENV
            FP=$(keytool -list -v -keystore app/kryptx-release-key.jks -alias kryptx-release -storepass "kryptx-ci-pass" | grep -i "SHA256:" | head -1 | awk '{print $2}' | tr -d ':')
            echo "KRYPTX_RELEASE_FINGERPRINT=$FP" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Secure Cleanup of Keystore
        if: always()
        run: |
          if [ -f app/kryptx-release-key.jks ]; then
            shred -u app/kryptx-release-key.jks 2>/dev/null || rm -f app/kryptx-release-key.jks
          fi

      - name: Enforce APK Size Budget (<= 25 MB)
        run: |
          APK_FILES=$(find app/build/outputs/apk/release/ -name "*.apk")
          if [ -z "$APK_FILES" ]; then
            echo "No release APK found to check size!"
            exit 1
          fi
          MAX_BYTES=26214400 # 25 MB
          for APK_PATH in $APK_FILES; do
            SIZE_BYTES=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
            echo "Release APK: $APK_PATH ($SIZE_BYTES bytes, budget: $MAX_BYTES bytes)"
            if [ "$SIZE_BYTES" -gt "$MAX_BYTES" ]; then
              echo "ERROR: Release APK $APK_PATH exceeds 25 MB budget ($SIZE_BYTES > $MAX_BYTES)!"
              exit 1
            fi
          done
          echo "All release APK size budgets verified."

      - name: Generate SHA-256 Checksums
        run: |
          mkdir -p release-dist
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-dist/ \;
          cd release-dist
          for f in *.apk; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          cd ..

      - name: Generate Software Bill of Materials (SBOM)
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > release-dist/sbom-dependencies.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
