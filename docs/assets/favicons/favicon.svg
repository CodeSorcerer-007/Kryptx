<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0070F3"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0051B3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" ry="108" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Outer Shield / Vault Icon -->
  <g filter="url(#glow)">
    <path d="M256 72 L392 128 V248 C392 344 332 418 256 444 C180 418 120 344 120 248 V128 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="18" stroke-linejoin="round"/>
  </g>
  
  <!-- Keyhole / Core Lock Symbol -->
  <circle cx="256" cy="224" r="36" fill="url(#coreGrad)"/>
  <path d="M242 246 L234 324 H278 L270 246 Z" fill="url(#coreGrad)"/>
  
  <!-- Circuit Accent Nodes -->
  <circle cx="256" cy="154" r="8" fill="#00E5FF"/>
  <line x1="256" y1="162" x2="256" y2="188" stroke="#00E5FF" stroke-width="6" stroke-linecap="round"/>
</svg>
